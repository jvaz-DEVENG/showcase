name: build

on:
  push:
    branches: [main]
    paths: ['GameBoost/**', '.github/workflows/build.yml']
  pull_request:
    paths: ['GameBoost/**']
  workflow_dispatch:

defaults:
  run:
    working-directory: GameBoost

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restaurar
        run: dotnet restore GameBoost.sln

      - name: Compilar
        run: dotnet build GameBoost.sln -c Release --no-restore -warnaserror

      - name: Testar
        run: dotnet test GameBoost.sln -c Release --no-build --logger "trx;LogFileName=testes.trx"

      - name: Publicar testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-testes
          path: GameBoost/**/TestResults/*.trx

      - name: Publicar executavel
        run: >
          dotnet publish src/GameBoost.App/GameBoost.App.csproj
          -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishReadyToRun=true
          -o publish

      # Trimming quebra WPF e reflexao (secao 10 do spec). Falha a build se alguem ligar.
      - name: Conferir que o trimming segue desligado
        shell: pwsh
        run: |
          $props = Get-Content Directory.Build.props -Raw
          if ($props -notmatch '<PublishTrimmed>false</PublishTrimmed>') {
            throw 'PublishTrimmed precisa continuar false: trimming quebra WPF.'
          }

      - name: Montar o instalador
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y --no-color

          # $env:ProgramFiles(x86) nao e sintaxe valida: o PowerShell le
          # "$env:ProgramFiles" e deixa "(x86)" solto, virando
          # "C:\Program Files(x86)". A forma correta e ${env:...}.
          # O ISCC tambem muda de lugar conforme a instalacao, entao vale
          # procurar em vez de fixar um caminho.
          $candidatos = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          )

          $iscc = $candidatos | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            throw "ISCC.exe nao encontrado. Procurado em: $($candidatos -join '; ')"
          }

          Write-Host "Usando $iscc"
          & $iscc installer\GameBoost.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC falhou com codigo $LASTEXITCODE" }

      - name: Gerar SHA256SUMS
        shell: pwsh
        run: |
          $arquivos = @(Get-ChildItem publish\GameBoost.exe, installer\Output\*.exe -ErrorAction SilentlyContinue)
          $arquivos | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          } | Set-Content SHA256SUMS.txt -Encoding utf8
          Get-Content SHA256SUMS.txt

      - name: Publicar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: gameboost
          path: |
            GameBoost/publish/GameBoost.exe
            GameBoost/installer/Output/*.exe
            GameBoost/SHA256SUMS.txt
